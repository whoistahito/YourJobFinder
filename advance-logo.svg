<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" baseProfile="tiny-ps" version="1.2">
  <title>JobFinder</title>
  <!-- neo-brutalism: flat fills, thick black outline, hard offset shadow -->
  <rect x="0" y="0" width="512" height="512" fill="#B9D2FF"/>

  <!-- hard offset shadow (same shape, solid black, shifted) -->
  <path d="M176 184 L232 184 A40 40 0 1 1 312 184 L368 184
           L368 240 A40 40 0 1 0 368 320 L368 376
           L312 376 A40 40 0 1 1 232 376 L176 376
           L176 320 A40 40 0 1 0 176 240 Z"
        fill="#111111"/>

  <!-- puzzle piece body -->
  <path d="M160 168 L216 168 A40 40 0 1 1 296 168 L352 168
           L352 224 A40 40 0 1 0 352 304 L352 360
           L296 360 A40 40 0 1 1 216 360 L160 360
           L160 304 A40 40 0 1 0 160 224 Z"
        fill="#2F6BFF" stroke="#111111" stroke-width="12" stroke-linejoin="round"/>

  <!-- letter J -->
  <path d="M228 200 L300 200 L300 224 L276 224 L276 298
           A34 34 0 0 1 208 298 L232 298
           A10 10 0 0 0 252 298 L252 224 L228 224 Z"
        fill="#FFFFFF" stroke="#111111" stroke-width="10" stroke-linejoin="round"/>
</svg>
